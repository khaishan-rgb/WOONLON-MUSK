# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: sentry-options
    runtime: python
    plan: starter            # free plans sleep when idle, which pauses the background worker
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATA_MODE
        value: live
      - key: DATABASE_URL
        fromDatabase:
          name: sentry-db
          property: connectionString
      - key: APP_PASSWORD
        sync: false          # choose a login password - strongly recommended
      - key: SECRET_KEY
        generateValue: true
      - key: GATEWAY_TOKEN
        generateValue: true  # copy this value into gateway.env on your computer
      - key: ALLOW_REAL_ORDERS
        value: "0"           # 1 = allow real-money orders you confirm (also needs the Settings switch + gateway switch)
      - key: SEC_USER_AGENT
        sync: false          # e.g. "Your Name you@email.com"
      - key: FINNHUB_API_KEY
        sync: false          # optional
      - key: ALERT_WEBHOOK_URL
        sync: false          # optional, e.g. https://ntfy.sh/your-secret-topic
databases:
  - name: sentry-db
    plan: free
